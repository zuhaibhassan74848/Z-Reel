name: Build Z Reels APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android Project
        run: |
          unzip -o Z_Reels_Final_SkyBlue_Project.zip -d extracted
          cp -r extracted/* .
          cp -r extracted/.[!.]* . 2>/dev/null || true

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Z-Reels-APK
          path: app/build/outputs/apk/debug/app-debug.apk
